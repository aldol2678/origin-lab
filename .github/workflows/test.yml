name: Build and regression tests
on:
  pull_request:
  push:
    branches: ['feature/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa/screenshots
      - run: npm run build
      - run: git diff --exit-code -- origin-lab-v0.3.html
      - run: npm run audit:public
      - run: npm test
      - run: npm run test:evidence
      - run: npm run test:browser
